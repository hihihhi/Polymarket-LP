[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-lp"
version = "0.1.0"
description = "Polymarket LP reward-farming portfolio metrics and backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Polymarket-LP contributors" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["polymarket_lp*"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff.lint]
select = ["F", "I"]
